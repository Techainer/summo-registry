name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: schema and licence rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Techainer/summo-app
          path: summo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: summo

      # Rejects a missing licence, a malformed digest, a file name that could escape the model
      # directory, and a non-redistributable model pointed at our own CDN.
      - name: Check every manifest
        working-directory: summo
        run: cargo run --quiet -p summo-cli -- registry check ${{ github.workspace }}

      # Against `schema/manifest.schema.json`, which this job is named after and did not read.
      #
      # `registry check` validates by deserialising into the app's own types, which is the right
      # check for the app and says nothing about the published schema. Nothing read that file, so
      # it had drifted until nine of fifteen manifests in this repository failed it: it had never
      # heard of `variants`, of `gated`, of a `variant` tag on a file, or of `translate` as a task
      # — every one of them shipped and in use. Somebody writing their first manifest against the
      # schema would have been told their valid model was invalid.
      - name: Every manifest matches the published schema
        run: |
          pip install --quiet jsonschema
          python3 - <<'PY'
          import glob, json, sys
          import jsonschema

          schema = json.load(open("schema/manifest.schema.json"))
          validator = jsonschema.Draft202012Validator(schema)
          failures = 0
          for path in sorted(glob.glob("models/*.json")):
              manifest = json.load(open(path))
              for error in validator.iter_errors(manifest):
                  where = "/".join(map(str, error.path)) or "(root)"
                  print(f"FAIL {path}: {where}: {error.message}")
                  failures += 1
          sys.exit(1 if failures else 0)
          PY

  reachable:
    name: files exist and match their digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A manifest whose files 404 is worse than no manifest: the app offers a model and then fails
      # halfway through a download.
      #
      # Every source, not the first one that answers. This used to `break` out of the URL list on
      # the first success, which is always the upstream `url` — so a `mirror` was listed, published,
      # and never once fetched. Twenty-eight of fifty-six mirror entries were checked by hand the
      # day this was rewritten and two models were broken: the only voice in the catalogue had both
      # of its mirrors 404ing, because the release asset was uploaded under a different name than
      # the manifest asks for and `summo.techainer.com` proxies that same release; and three of
      # `gipformer-65m`'s pointed at a Hugging Face repository that had been renamed, so they
      # resolved to a repository now holding *different* weights.
      #
      # Which matters precisely when it is needed. The mirrors exist because GitHub and Hugging Face
      # are regularly unreachable from Vietnam — a mirror nobody checks is a fallback that works
      # until the day it has to.
      - name: Fetch and verify
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, sys, urllib.request

          # The primary is downloaded whole and hashed. A mirror is checked by its first chunk and
          # its total length, which is what separates "this URL answers" from "this URL answers
          # with the file the manifest describes" — a renamed upstream repository serving a
          # same-named file is exactly the case a status code cannot see. Whole-file hashing every
          # mirror would triple a job that already moves several gigabytes.
          PREFIX = 64 * 1024

          def get(url, first=None, tries=3):
              """Body, and the file's total length when the server reports one."""
              last = None
              for attempt in range(tries):
                  request = urllib.request.Request(url)
                  if first is not None:
                      request.add_header("Range", f"bytes=0-{first - 1}")
                  try:
                      with urllib.request.urlopen(request, timeout=300) as response:
                          body = response.read()
                          content_range = response.headers.get("Content-Range")
                          if content_range and "/" in content_range:
                              total = content_range.rsplit("/", 1)[1]
                              total = int(total) if total.isdigit() else None
                          else:
                              # No range served: this is the whole file, whatever we asked for.
                              total = len(body)
                          return body, total
                  except Exception as error:  # noqa: BLE001
                      last = error
              raise last

          failures = []
          for path in sorted(glob.glob("models/*.json")):
              manifest = json.load(open(path))
              for entry in manifest["files"]:
                  name = f"{manifest['id']}/{entry['name']}"

                  try:
                      body, _ = get(entry["url"])
                  except Exception as error:  # noqa: BLE001
                      failures.append(f"{name}: url unreachable: {error}")
                      continue

                  digest = hashlib.sha256(body).hexdigest()
                  if digest != entry["sha256"]:
                      failures.append(f"{name}: url digest {digest} != {entry['sha256']}")
                      continue
                  if len(body) != entry["size"]:
                      failures.append(f"{name}: url size {len(body)} != {entry['size']}")
                      continue
                  print(f"ok {name} url")

                  for mirror in entry.get("mirror", []):
                      try:
                          head, total = get(mirror, first=PREFIX)
                      except Exception as error:  # noqa: BLE001
                          failures.append(f"{name}: mirror unreachable: {mirror}: {error}")
                          continue
                      if total is not None and total != entry["size"]:
                          failures.append(
                              f"{name}: mirror is {total} bytes, manifest says {entry['size']}: {mirror}"
                          )
                      elif head != body[: len(head)]:
                          failures.append(
                              f"{name}: mirror serves different bytes than the manifest describes: {mirror}"
                          )
                      else:
                          print(f"ok {name} mirror {mirror}")

          for failure in failures:
              print(f"FAIL {failure}")
          sys.exit(1 if failures else 0)
          PY

  index:
    name: index matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The index is what the app lists before fetching anything, so an entry missing from it makes
      # a model invisible even though its manifest is perfectly valid.
      - run: |
          python3 - <<'PY'
          import glob, json, os, sys

          index = {m["id"] for m in json.load(open("index.json"))["models"]}
          files = {os.path.basename(p)[:-5] for p in glob.glob("models/*.json")}

          missing = files - index
          extra = index - files
          for id in sorted(missing):
              print(f"FAIL {id} has a manifest but is not in index.json")
          for id in sorted(extra):
              print(f"FAIL {id} is in index.json but has no manifest")

          # The same id in two files is not the same entry.
          #
          # This checked that the two *sets of ids* matched and nothing about what the entries say,
          # so every field the index copies from a manifest — name, licence, languages, size, the
          # description a user reads on the card before downloading anything — could drift without
          # a word. It did, the first time somebody edited a manifest: a model's description said
          # "the fastest of them here" on the card and something else in the file behind it.
          #
          # Only the shared keys. The index carries less than a manifest on purpose; what it does
          # carry has to be the same thing.
          drift = 0
          for entry in json.load(open("index.json"))["models"]:
              path = f"models/{entry['id']}.json"
              if not os.path.exists(path):
                  continue
              manifest = json.load(open(path))
              for key, value in entry.items():
                  if key in manifest and manifest[key] != value:
                      drift += 1
                      print(f"FAIL {entry['id']}.{key} differs between index.json and {path}")

          sys.exit(1 if missing or extra or drift else 0)
          PY
