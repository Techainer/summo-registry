name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: schema and licence rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Techainer/summo-app
          path: summo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: summo

      # Rejects a missing licence, a malformed digest, a file name that could escape the model
      # directory, and a non-redistributable model pointed at our own CDN.
      - name: Check every manifest
        working-directory: summo
        run: cargo run --quiet -p summo-cli -- registry check ${{ github.workspace }}

      # Against `schema/manifest.schema.json`, which this job is named after and did not read.
      #
      # `registry check` validates by deserialising into the app's own types, which is the right
      # check for the app and says nothing about the published schema. Nothing read that file, so
      # it had drifted until nine of fifteen manifests in this repository failed it: it had never
      # heard of `variants`, of `gated`, of a `variant` tag on a file, or of `translate` as a task
      # — every one of them shipped and in use. Somebody writing their first manifest against the
      # schema would have been told their valid model was invalid.
      - name: Every manifest matches the published schema
        run: |
          pip install --quiet jsonschema
          python3 - <<'PY'
          import glob, json, sys
          import jsonschema

          schema = json.load(open("schema/manifest.schema.json"))
          validator = jsonschema.Draft202012Validator(schema)
          failures = 0
          for path in sorted(glob.glob("models/*.json")):
              manifest = json.load(open(path))
              for error in validator.iter_errors(manifest):
                  where = "/".join(map(str, error.path)) or "(root)"
                  print(f"FAIL {path}: {where}: {error.message}")
                  failures += 1
          sys.exit(1 if failures else 0)
          PY

  reachable:
    name: files exist and match their digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A manifest whose files 404 is worse than no manifest: the app offers a model and then fails
      # halfway through a download.
      - name: Fetch and verify
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, sys, urllib.request

          failures = []
          for path in sorted(glob.glob("models/*.json")):
              manifest = json.load(open(path))
              for entry in manifest["files"]:
                  urls = [entry["url"], *entry.get("mirror", [])]
                  for url in urls:
                      try:
                          with urllib.request.urlopen(url, timeout=120) as response:
                              body = response.read()
                          break
                      except Exception as error:  # noqa: BLE001
                          print(f"  {url}: {error}")
                  else:
                      failures.append(f"{manifest['id']}/{entry['name']}: no source reachable")
                      continue

                  digest = hashlib.sha256(body).hexdigest()
                  if digest != entry["sha256"]:
                      failures.append(
                          f"{manifest['id']}/{entry['name']}: digest {digest} != {entry['sha256']}"
                      )
                  elif len(body) != entry["size"]:
                      failures.append(
                          f"{manifest['id']}/{entry['name']}: size {len(body)} != {entry['size']}"
                      )
                  else:
                      print(f"ok {manifest['id']}/{entry['name']}")

          for failure in failures:
              print(f"FAIL {failure}")
          sys.exit(1 if failures else 0)
          PY

  index:
    name: index matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The index is what the app lists before fetching anything, so an entry missing from it makes
      # a model invisible even though its manifest is perfectly valid.
      - run: |
          python3 - <<'PY'
          import glob, json, os, sys

          index = {m["id"] for m in json.load(open("index.json"))["models"]}
          files = {os.path.basename(p)[:-5] for p in glob.glob("models/*.json")}

          missing = files - index
          extra = index - files
          for id in sorted(missing):
              print(f"FAIL {id} has a manifest but is not in index.json")
          for id in sorted(extra):
              print(f"FAIL {id} is in index.json but has no manifest")

          # The same id in two files is not the same entry.
          #
          # This checked that the two *sets of ids* matched and nothing about what the entries say,
          # so every field the index copies from a manifest — name, licence, languages, size, the
          # description a user reads on the card before downloading anything — could drift without
          # a word. It did, the first time somebody edited a manifest: a model's description said
          # "the fastest of them here" on the card and something else in the file behind it.
          #
          # Only the shared keys. The index carries less than a manifest on purpose; what it does
          # carry has to be the same thing.
          drift = 0
          for entry in json.load(open("index.json"))["models"]:
              path = f"models/{entry['id']}.json"
              if not os.path.exists(path):
                  continue
              manifest = json.load(open(path))
              for key, value in entry.items():
                  if key in manifest and manifest[key] != value:
                      drift += 1
                      print(f"FAIL {entry['id']}.{key} differs between index.json and {path}")

          sys.exit(1 if missing or extra or drift else 0)
          PY
